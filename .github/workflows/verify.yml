name: verify

# The gate that stops verification claims from decaying.
#
# This repository accumulated three false records in two days — NFR-33
# recorded PASS against a stale commit while it was failing, a completion
# figure 11 points out of date, and a catalogue that claimed bindings reached
# the agent when they did not. None was carelessness: every one was true when
# written and rotted because nothing re-checked it. 2,400 tests that only run
# when someone remembers are not a safety net, they are a record of one
# afternoon.
#
# ---------------------------------------------------------------------------
# Cost, and why the shape below
#
# The first version ran eight jobs on every push: three OSes of TypeScript,
# two of Python, and the performance budgets, with the artefact gated behind
# all of them. That is roughly fifty minutes of wall-clock and eight runners
# for a one-line change, and a build people wait fifty minutes for is a build
# people learn to push past.
#
# Two observations reshape it:
#
#   1. Cross-platform breakage is a property of the code, not of the commit.
#      It is worth catching, but not worth catching three times a day on a
#      development branch. The full matrix runs on `main`, on the schedule,
#      and on demand; a dev-branch push gets ubuntu and gets it fast.
#
#   2. The performance budgets already say of themselves that they "drift
#      with features, not with commits" — that is why the schedule exists.
#      Running them on every push contradicted their own reasoning AND put
#      the slowest serial job on the critical path to the artefact.
#
# Correctness coverage is unchanged on `main`. What changes is how often the
# expensive shape runs, and how quickly a developer learns they broke
# something.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, dev_local]
  pull_request:
  # Performance budgets drift with features, not with commits, so they are
  # checked on a schedule — a quiet week is exactly when a budget slips
  # unnoticed. The weekly run is also the full-matrix run.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run the full OS matrix and the performance budgets'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '1'
  # Each CI job owns its runner, so the cross-suite lock guards nothing here
  # and only adds a failure mode: a cancelled run that leaves a lock behind
  # blocks the next suite in the same job for a reason that has nothing to do
  # with the code. The lock's own documentation says as much.
  MERIDIAN_ALLOW_CONCURRENT_SUITE: '1'

jobs:
  # ---------------------------------------------------------------------
  # Contracts first: a stale generated type, an orphaned RPC method or a
  # document that has drifted from the tree makes every downstream result
  # meaningless, and all of it takes seconds. Nothing else starts until
  # these pass, so a drifted claim costs one minute rather than forty.
  # ---------------------------------------------------------------------
  contracts:
    name: contracts, documents and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # The matrix every downstream job uses. Computed once, here, so the
      # policy lives in one place instead of repeated `if:` conditions.
      os_matrix: ${{ steps.scope.outputs.os_matrix }}
      run_budgets: ${{ steps.scope.outputs.run_budgets }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: how much to run
        id: scope
        shell: bash
        run: |
          # Full shape on main, on the weekly schedule, and on demand.
          # Everything else — dev-branch pushes, pull requests — gets the
          # fast shape. A PR into main still gets the full shape from the
          # push that merges it.
          # Written as if/elif rather than `[ … ] && full=true`: GitHub runs
          # bash with `set -e`, so a test that is simply false would end the
          # step with status 1 and fail the build for taking the fast path.
          full=false
          if [ "${{ github.event_name }}" = 'schedule' ]; then
            full=true
          elif [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            full='${{ inputs.full_matrix }}'
          elif [ "${{ github.ref }}" = 'refs/heads/main' ]; then
            full=true
          fi
          if [ "$full" = 'true' ]; then
            echo 'os_matrix=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
            echo 'run_budgets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'os_matrix=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo 'run_budgets=false' >> "$GITHUB_OUTPUT"
          fi

      - name: bus types match the schema (FR-M32-09)
        run: npm run check:contracts
      - name: no orphaned or unsurfaced RPC methods (FR-M46-01/02, AC-43)
        run: npm run check:surface

      # MV0's document gates. Each guards a document against the tree, each
      # takes about a second, and each exists because a document drifted and
      # nothing noticed: a requirements file asserting a suite that was red,
      # a README listing directories that were not there, and a security
      # document asserting a dependency licence set nobody re-checked.
      - name: requirements and plan agree (MV0-T04)
        run: node scripts/check-mvp-traceability.mjs
      - name: every shipped claim names a test that exists (MV0-T03, MP5)
        run: node scripts/check-claims.mjs
      - name: no copyleft runtime dependency (MV0-T05, ECO-03)
        run: node scripts/check-licences.mjs
      - name: the support matrix is backed and its table is current (MV1-T05/T06)
        run: node scripts/check-compatibility.mjs

      - name: typecheck
        run: |
          npx tsc --noEmit -p extension
          npx tsc --noEmit -p webview

  # ---------------------------------------------------------------------
  # The TypeScript halves. Split from the Python job so a failure names the
  # half it is in rather than "the suite".
  # ---------------------------------------------------------------------
  typescript:
    name: extension and webview (${{ matrix.os }})
    needs: contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Path handling, the keyring and process spawning are the three
        # places the platforms differ, and all three are load-bearing here.
        # See the header for why this is one OS on a dev push and three on
        # main.
        os: ${{ fromJSON(needs.contracts.outputs.os_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # The real-sidecar e2e tests install the sidecar, and cryptography
          # and tree-sitter are not cheap to fetch three times over. This was
          # simply missing before.
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - name: install the sidecar (real-sidecar e2e tests spawn it)
        run: pip install -e ./core
      - run: npm ci
      # --reporter=dot: the verbose reporter prints a line per test, which is
      # ~800 lines of log per job and makes a real failure harder to find,
      # not easier. Failures are reported in full either way.
      - name: extension
        working-directory: extension
        run: npx vitest run --reporter=dot
      - name: webview
        working-directory: webview
        run: npx vitest run --reporter=dot

  # ---------------------------------------------------------------------
  # The Python core. This is the critical path — most of the suite spawns
  # real git and sidecar subprocesses — so it starts at the same time as
  # the TypeScript job rather than after it.
  # ---------------------------------------------------------------------
  core:
    name: python core (${{ matrix.os }})
    needs: contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The sidecar ships to Windows users and several of its load-bearing
      # paths are Windows-specific: the orphan guard's job objects, the run
      # lock's ctypes liveness probe, path separators through every git call.
      # On main that is covered; on a dev push, ubuntu is the fast signal.
      matrix:
        os: ${{ fromJSON(needs.contracts.outputs.os_matrix) }}
        exclude:
          - os: macos-latest # the sidecar has no macOS-specific path; ubuntu covers POSIX
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e './core[dev]'
      # Correctness everywhere; budgets nowhere near a shared runner. A 50k
      # measurement taken while three other suites are running is noise, and
      # noise that fails the build teaches people to ignore the build.
      # MERIDIAN_PERF_REPORT_ONLY keeps every AC-41 equality assertion live
      # and prints the timings without enforcing them.
      #
      # -n auto because a serial run is about an hour and three quarters:
      # most of this suite spawns real git and sidecar subprocesses, and each
      # xdist worker is its own process with its own tmp dirs, so the
      # parallelism is isolated by construction.
      - name: core suite
        working-directory: core
        env:
          MERIDIAN_PERF_REPORT_ONLY: '1'
        run: python -m pytest tests -q -m "not perf" -n auto --tb=short

  # ---------------------------------------------------------------------
  # Budgets, alone, on a runner doing nothing else. This is the only place
  # a timing failure means what it says — and the reason it is not on every
  # push is written in the header.
  # ---------------------------------------------------------------------
  performance:
    name: performance budgets
    needs: contracts
    if: needs.contracts.outputs.run_budgets == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/pyproject.toml
      - run: pip install -e ./core

      # Deliberately NOT parallel. A budget measured while seven other workers
      # compete for the machine is the noise this arrangement exists to
      # remove, and it is why NFR-33 read PASS while failing.
      # Reported on every run, not only when they break: a budget creeping
      # toward its ceiling should be visible before it crosses it.
      - name: NFR-33 budgets over a 50k ledger
        working-directory: core
        run: python -m pytest tests/test_full_history_metrics.py -q -s --tb=short

      - name: the remaining performance floors
        working-directory: core
        run: python -m pytest tests -q -s -m perf --tb=short

  # ---------------------------------------------------------------------
  # The artefact. Building it in CI catches the packaging failures that a
  # local `npm run build` never sees — a file missing from .vscodeignore, a
  # bundle that only resolves against a warm node_modules, a path that must
  # never ship still sitting in the index.
  #
  # Gated on correctness, not on the budgets: a timing measurement says
  # nothing about whether the package is well-formed, and waiting for one
  # put twenty minutes between a green suite and an installable VSIX.
  # ---------------------------------------------------------------------
  package:
    name: build and package
    needs: [typescript, core]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - name: the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: meridian-loom-vsix
          path: dist/*.vsix
          if-no-files-found: error
          # The artefact is a build output, not an archive. Ninety days of
          # every dev-branch VSIX is storage nobody reads.
          retention-days: 14
