[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-core"
version = "0.0.1"
description = "Meridian Loom sidecar: framed JSON-RPC 2.0 over stdio (FR-M3-01)."
requires-python = ">=3.11"
dependencies = [
    # Approved pinned dependency for ledger cryptography: Ed25519 tree-head
    # signing (FR-M10-04) and AES-GCM blob encryption (FR-M10-07). Python's
    # stdlib has neither. NEVER use this (or anything else) for model calls.
    "cryptography==49.0.0",
    # Approved pinned dependency for structural parsing (FR-M33-02 subset,
    # F0 Workstream C task 14): tree-sitter line→symbol mapping so a
    # provenance answer names the enclosing function/class. Deterministic
    # parsing only — NEVER used for model calls (FR-M36-07).
    "tree-sitter==0.25.1",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.25.0",
    # Approved pinned dependency for declarative policy-pack parsing
    # (FR-M12-01, F1 Workstream B): governance packs load through
    # yaml.safe_load only. Deterministic structural parsing — NEVER used
    # for model calls (FR-M36-07).
    "PyYAML==6.0.2",
    # Approved pinned dependency for engine-side output validation
    # (FR-M33-04/05, F3 M33 slice 3): model output is validated against
    # the class's JSON Schema before it takes effect. Deterministic
    # validation only — NEVER used for model calls (FR-M36-07).
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["meridian_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fixture corpora under tests/fixtures/ contain intentionally-named test
# files (e.g. coverage-mapping fixtures like test_payments.py); they are
# capability inputs, not suite members.
norecursedirs = ["tests/fixtures"]
# Makes `python -m pytest core/tests` from the repo root work as well as
# `cd core && python -m pytest -q`: pytest resolves this file as rootdir
# config and puts core/ (and the generated bus types) on sys.path.
pythonpath = [".", "../shared/py"]
markers = [
    "perf: performance assertions (still run in CI; generous floors, measured rates reported)",
]
